[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlhf"
version = "0.1.0"
description = "A GPT-style model pretrained from scratch and aligned with RLHF (SFT, reward model, PPO, DPO)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.3",
    "numpy",
    "tiktoken",
    "datasets",
    "huggingface_hub",
    "wandb",
    "pyyaml",
    "tqdm",
    "rouge-score",
    "anthropic",
    "matplotlib",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than a few seconds; skipped in CI"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["rlhf"]
