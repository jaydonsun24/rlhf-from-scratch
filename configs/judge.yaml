# LLM judge (final eval step 2, runs on a laptop: needs the internet).
#   python -m rlhf.eval.judge --config configs/judge.yaml a=ppo b=reference
# a / b are file names in summaries_dir, or "reference" for the human TL;DRs.
a: ppo
b: reference

model: claude-opus-5-5        # recorded in every results file; changing it invalidates the cache
effort: low                   # a short A/B choice doesn't need deep thinking
max_tokens: 8000              # room for thinking + one sentence
prompt_file: configs/judge_prompt.txt   # fixed for the whole project

summaries_dir: runs/eval/summaries
out_dir: runs/eval/judge
cache_path: data/judge_cache.jsonl
max_calls: 2500               # safety cap on NEW (uncached) API calls per run
workers: 8                    # parallel requests
skip_confirm: false                 # true = skip the cost confirmation
write_results: true           # results/judge_<a>_vs_<b>.json

bootstrap_resamples: 10000
seed: 0
